name: LoanRadar Daily Pipeline

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  fetch-leads:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Step 1 - Fetch Registrations
        run: node scripts/1_fetch_registrations.js
        env:
          TARGET_CITIES: ${{ vars.TARGET_CITIES || 'Jaipur,Jodhpur,Kota,Udaipur,Ajmer,Bikaner,Alwar' }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS || '7' }}

      - name: Run Step 2 - Enrich Contacts
        run: node scripts/2_enrich_contacts.js

      - name: Run Step 3 - Score and Rank
        run: node scripts/3_score_and_rank.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAILY_LEAD_TARGET: ${{ vars.DAILY_LEAD_TARGET || '10' }}

      - name: Save leads back to repo
        run: |
          git config --global user.email "loanradar-bot@github.com"
          git config --global user.name "LoanRadar Bot"
          git add data/leads_today.json data/run_log.json
          git diff --staged --quiet || git commit -m "Daily leads - $(date +'%Y-%m-%d')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show summary
        run: |
          node -e "
            try {
              const d = require('./data/leads_today.json');
              console.log('Total leads:', d.totalSelected);
              console.log('Hot:', d.hotLeads, '| Warm:', d.warmLeads, '| Cold:', d.coldLeads);
              console.log('Phones found:', d.phonesFound + '/' + d.totalSelected);
              d.leads.slice(0,3).forEach((l,i) => console.log((i+1)+'.', l.name, '-', l.city, '-', l.tier.toUpperCase()));
            } catch(e) { console.log('No leads file yet'); }
          "
